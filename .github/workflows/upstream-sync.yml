name: "Downstream upstream sync"

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: downstream-upstream-sync
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  sync:
    if: github.repository == 'abushadab/probo'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SYNC_BRANCH: automation/upstream-sync
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: main
          fetch-depth: 0
      - name: Merge current upstream
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/getprobo/probo.git
          git fetch upstream main
          git switch -C "$SYNC_BRANCH"

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git merge --no-edit upstream/main; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Report merge conflict
        if: steps.merge.outputs.conflict == 'true'
        run: |
          existing="$(gh issue list --state open --search 'Upstream sync conflict in:title' --json number --jq '.[0].number')"
          if [ -z "$existing" ]; then
            gh issue create \
              --title "Upstream sync conflict" \
              --body "The scheduled sync could not merge getprobo/probo main. Resolve the conflict locally and update main before the next run."
          fi
      - name: Push sync branch
        if: steps.merge.outputs.changed == 'true'
        run: |
          git fetch origin "$SYNC_BRANCH:refs/remotes/origin/$SYNC_BRANCH" || true
          git push --force-with-lease origin "HEAD:refs/heads/$SYNC_BRANCH"
      - name: Open or update pull request
        if: steps.merge.outputs.changed == 'true'
        run: |
          number="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&head=${GITHUB_REPOSITORY_OWNER}%3A${SYNC_BRANCH}" --jq '.[0].number')"
          if [ -z "$number" ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pulls" \
              -f base=main \
              -f head="$SYNC_BRANCH" \
              -f title="chore: sync upstream Probo" \
              -f body="Automated merge of the latest getprobo/probo main. Review upstream release notes, migration changes, and downstream CI before merging." \
              --silent
          fi
      - name: Dispatch downstream CI
        if: steps.merge.outputs.changed == 'true'
        run: gh workflow run downstream-ci.yml --repo "$GITHUB_REPOSITORY" --ref "$SYNC_BRANCH"
